services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coreq
      POSTGRES_USER: coreq
      POSTGRES_PASSWORD: change-me-before-use
    ports:
      - "5432:5432"
    volumes:
      - coreq_postgres:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreq -d coreq"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  coreq_postgres:
